<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Minecraft PWA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }

    /* ===== LOADING SCREEN ===== */
    #loadScreen {
      position:fixed; inset:0; background:#1a1a2e;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:9999;
    }
    #loadScreen h1 { color:#5dade2; font-size:2.5rem; font-weight:900; text-shadow:0 0 20px #5dade2; letter-spacing:4px; }
    #loadScreen p { color:#aaa; margin-top:10px; font-size:0.9rem; }
    .loadBar { width:280px; height:8px; background:#333; border-radius:4px; margin-top:20px; overflow:hidden; }
    .loadFill { height:100%; background:linear-gradient(90deg,#27ae60,#5dade2); border-radius:4px; animation:load 2s ease forwards; }
    @keyframes load { from{width:0} to{width:100%} }

    /* ===== START SCREEN ===== */
    #startScreen {
      position:fixed; inset:0;
      background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 60%,#228B22 60%,#228B22 100%);
      display:none; flex-direction:column; align-items:center; justify-content:center; z-index:1000;
    }
    #startScreen h1 { 
      color:#fff; font-size:3rem; font-weight:900; 
      text-shadow:4px 4px 0 #5a3e28, -2px -2px 0 #5a3e28;
      letter-spacing:2px; margin-bottom:30px;
    }
    .startBtn {
      padding:16px 48px; font-size:1.2rem; font-weight:700;
      background:linear-gradient(180deg,#7ec850,#5a9e30); 
      color:#fff; border:3px solid #3d7a20; border-radius:4px;
      cursor:pointer; margin:8px; width:220px;
      box-shadow:0 4px 0 #2d5a10; text-shadow:1px 1px 0 #2d5a10;
      transition:transform 0.1s;
    }
    .startBtn:active { transform:translateY(4px); box-shadow:none; }
    #usernameInput {
      padding:12px 20px; font-size:1rem; border-radius:4px;
      border:3px solid #5a3e28; margin-bottom:16px; width:220px;
      background:#c8a87a; color:#3d2b1a; font-weight:700;
      text-align:center;
    }

    /* ===== GAME CANVAS ===== */
    #gameCanvas { 
      position:fixed; inset:0; display:none;
      width:100vw; height:100vh;
      touch-action:none;
    }

    /* ===== HUD ===== */
    #hud { position:fixed; inset:0; pointer-events:none; display:none; z-index:100; }

    /* Crosshair */
    #crosshair {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:20px; height:20px;
    }
    #crosshair::before, #crosshair::after {
      content:''; position:absolute; background:rgba(255,255,255,0.8);
    }
    #crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
    #crosshair::after { width:100%; height:2px; top:50%; transform:translateY(-50%); }

    /* Health Bar */
    #healthBar {
      position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
      display:flex; gap:3px;
    }
    .heart { font-size:18px; }

    /* Hotbar */
    #hotbar {
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      display:flex; gap:4px; pointer-events:all;
    }
    .hotSlot {
      width:50px; height:50px; background:rgba(0,0,0,0.5);
      border:2px solid #888; border-radius:4px;
      display:flex; align-items:center; justify-content:center;
      font-size:10px; color:#fff; flex-direction:column;
      cursor:pointer; position:relative; transition:border-color 0.1s;
    }
    .hotSlot.active { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,0.5); }
    .hotSlot .slotIcon { font-size:22px; }
    .hotSlot .slotCount {
      position:absolute; bottom:2px; right:4px;
      font-size:10px; font-weight:700; color:#fff;
      text-shadow:1px 1px 0 #000;
    }

    /* FPS Counter */
    #fpsCounter {
      position:absolute; top:8px; left:8px;
      color:#0f0; font-size:12px; font-family:monospace;
      text-shadow:1px 1px 0 #000; background:rgba(0,0,0,0.3);
      padding:2px 6px; border-radius:3px;
    }

    /* Coordinates */
    #coords {
      position:absolute; top:8px; right:8px;
      color:#fff; font-size:11px; font-family:monospace;
      text-shadow:1px 1px 0 #000; background:rgba(0,0,0,0.4);
      padding:4px 8px; border-radius:3px; text-align:right;
    }

    /* ===== JOYSTICK (Left) ===== */
    #joystickZone {
      position:fixed; left:10px; bottom:80px;
      width:130px; height:130px; pointer-events:all;
      z-index:200; opacity:0; display:none;
    }
    #joystickBase {
      width:100%; height:100%; background:rgba(255,255,255,0.15);
      border:2px solid rgba(255,255,255,0.3); border-radius:50%;
    }
    #joystickHandle {
      position:absolute; width:50px; height:50px;
      background:rgba(255,255,255,0.4); border:2px solid rgba(255,255,255,0.6);
      border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);
      transition:none; box-shadow:0 0 10px rgba(255,255,255,0.3);
    }

    /* ===== ACTION BUTTONS (Right) ===== */
    #actionBtns {
      position:fixed; right:10px; bottom:80px;
      display:none; flex-direction:column; gap:8px;
      pointer-events:all; z-index:200;
    }
    .actionBtn {
      width:60px; height:60px; border-radius:50%;
      border:none; font-size:18px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 0 rgba(0,0,0,0.5); transition:transform 0.08s;
      flex-direction:column; gap:2px;
    }
    .actionBtn:active { transform:scale(0.9); }
    .actionBtn span { font-size:8px; color:rgba(255,255,255,0.8); }
    #btnJump { background:linear-gradient(180deg,#e74c3c,#c0392b); color:#fff; }
    #btnBreak { background:linear-gradient(180deg,#e67e22,#d35400); color:#fff; }
    #btnPlace { background:linear-gradient(180deg,#27ae60,#1e8449); color:#fff; }

    /* ===== INVENTORY SCREEN ===== */
    #inventoryScreen {
      position:fixed; inset:0; background:rgba(0,0,0,0.85);
      display:none; align-items:center; justify-content:center;
      z-index:500; pointer-events:all;
    }
    #inventoryBox {
      background:#8b8b8b; border:3px solid #555;
      padding:16px; border-radius:4px; width:320px; max-width:95vw;
    }
    #inventoryBox h3 { color:#fff; text-align:center; margin-bottom:12px; font-size:1rem; text-shadow:1px 1px 0 #000; }
    #inventoryGrid {
      display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin-bottom:12px;
    }
    .invSlot {
      aspect-ratio:1; background:#6b6b6b; border:2px solid #444;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; cursor:pointer; border-radius:2px;
      position:relative; transition:border-color 0.1s;
    }
    .invSlot:hover, .invSlot.selected { border-color:#fff; }
    .invSlot .invCount {
      position:absolute; bottom:1px; right:2px; font-size:9px;
      color:#fff; font-weight:700; text-shadow:1px 1px 0 #000;
    }
    #closeInvBtn {
      width:100%; padding:10px; background:#c0392b; color:#fff;
      border:none; border-radius:3px; font-size:1rem; font-weight:700; cursor:pointer;
    }

    /* Inventory toggle button */
    #invBtn {
      position:fixed; top:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.6); border:2px solid #888;
      color:#fff; padding:6px 14px; border-radius:20px;
      cursor:pointer; pointer-events:all; z-index:200; font-size:14px;
      display:none;
    }

    /* ===== EMOJI WHEEL ===== */
    #emojiBtn {
      position:fixed; right:80px; bottom:10px;
      background:rgba(0,0,0,0.5); border:2px solid #888;
      width:46px; height:46px; border-radius:50%;
      font-size:20px; cursor:pointer; pointer-events:all; z-index:200;
      display:none; align-items:center; justify-content:center;
    }
    #emojiWheel {
      position:fixed; right:80px; bottom:70px;
      background:rgba(0,0,0,0.85); border:2px solid #555;
      border-radius:12px; padding:10px; display:none;
      grid-template-columns:repeat(3,1fr); gap:6px;
      pointer-events:all; z-index:300;
    }
    .emojiItem {
      width:44px; height:44px; background:rgba(255,255,255,0.1);
      border:2px solid #555; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; cursor:pointer; transition:background 0.1s;
    }
    .emojiItem:active { background:rgba(255,255,255,0.3); }

    /* ===== CHAT / EMOJI POPUP ===== */
    .emojiPopup {
      position:absolute; background:rgba(0,0,0,0.7);
      border-radius:20px; padding:4px 8px;
      font-size:18px; pointer-events:none;
      animation:floatUp 2s ease forwards;
      white-space:nowrap; z-index:400;
    }
    @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }

    /* Player nametag */
    .nametag {
      position:absolute; background:rgba(0,0,0,0.6);
      color:#fff; font-size:11px; padding:2px 6px;
      border-radius:3px; pointer-events:none; transform:translate(-50%,-100%);
      white-space:nowrap;
    }

    /* ===== CHAT BOX ===== */
    #chatBox {
      position:fixed; bottom:150px; left:8px;
      max-width:280px; pointer-events:none; z-index:150;
      display:none;
    }
    .chatMsg {
      background:rgba(0,0,0,0.5); color:#fff;
      font-size:12px; padding:3px 8px; border-radius:3px;
      margin-top:2px; animation:fadeMsg 5s ease forwards;
    }
    @keyframes fadeMsg { 0%,70%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loadScreen">
  <h1>⛏ MINECRAFT</h1>
  <p>Loading resources...</p>
  <div class="loadBar"><div class="loadFill"></div></div>
</div>

<!-- START SCREEN -->
<div id="startScreen">
  <h1>⛏ MINECRAFT PWA</h1>
  <input type="text" id="usernameInput" placeholder="Enter Username" maxlength="16"/>
  <button class="startBtn" id="btnSingleplayer">▶ Singleplayer</button>
  <button class="startBtn" id="btnMultiplayer">👥 Multiplayer</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"></div>
  <div id="fpsCounter">FPS: 0</div>
  <div id="coords">X:0 Y:0 Z:0</div>
  <div id="healthBar">
    <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>
  <div id="hotbar">
    <div class="hotSlot active" data-slot="0"><span class="slotIcon">🟫</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="1"><span class="slotIcon">⬜</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="2"><span class="slotIcon">🟩</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="3"><span class="slotIcon">🪨</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="4"><span class="slotIcon">🪵</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="5"><span class="slotIcon">🌊</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="6"><span class="slotIcon">🔦</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="7"><span class="slotIcon">🪨</span><span class="slotCount">0</span></div>
    <div class="hotSlot" data-slot="8"><span class="slotIcon">🍃</span><span class="slotCount">0</span></div>
  </div>
  <div id="chatBox"></div>
</div>

<!-- Joystick -->
<div id="joystickZone">
  <div id="joystickBase"></div>
  <div id="joystickHandle"></div>
</div>

<!-- Action Buttons -->
<div id="actionBtns">
  <button class="actionBtn" id="btnJump">⬆<span>JUMP</span></button>
  <button class="actionBtn" id="btnBreak">⛏<span>BREAK</span></button>
  <button class="actionBtn" id="btnPlace">📦<span>PLACE</span></button>
</div>

<!-- Inventory button -->
<div id="invBtn">🎒 Inventory</div>

<!-- Emoji button -->
<div id="emojiBtn">😊</div>

<!-- Emoji Wheel -->
<div id="emojiWheel">
  <div class="emojiItem" data-emoji="wave" title="Wave">👋</div>
  <div class="emojiItem" data-emoji="laugh" title="Laugh">😂</div>
  <div class="emojiItem" data-emoji="dance" title="Dance">💃</div>
  <div class="emojiItem" data-emoji="angry" title="Angry">😠</div>
  <div class="emojiItem" data-emoji="love" title="Love">❤️</div>
  <div class="emojiItem" data-emoji="cool" title="Cool">😎</div>
</div>

<!-- Inventory Screen -->
<div id="inventoryScreen">
  <div id="inventoryBox">
    <h3>🎒 Inventory</h3>
    <div id="inventoryGrid"></div>
    <button id="closeInvBtn">✖ Close</button>
  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Socket.io CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<!-- Game Logic -->
<script src="game.js"></script>

<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
