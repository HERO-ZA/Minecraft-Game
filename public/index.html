<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mycraft - Web Edition</title>

    <!-- PWA (Progressive Web App) အတွက် လိုအပ်သော Meta Tags များ -->
    <!-- ဤသည်တို့မှာ PWA ကို ဖုန်း Home Screen ပေါ် တင်နိုင်ရန်နှင့် Browser UI ကို ဖျောက်ရန်အတွက် ဖြစ်သည်။ -->
    <meta name="theme-color" content="#3498db"/>
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">

    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Body Styles for Fullscreen Game */
        body {
            background: #000;
            overflow: hidden; /* No scrollbars */
            font-family: 'Press Start 2P', monospace; /* Minecraft-like font */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            cursor: default;
        }

        /* Canvas for 3D Rendering */
        #c {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Crosshair in the center */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            pointer-events: none; /* Allows clicks to pass through */
            text-shadow: 1px 1px 2px #000;
            z-index: 100; /* Above everything else */
        }

        /* Hotbar at the bottom center */
        #hotbar {
            position: fixed;
            bottom: 140px; /* Adjust for mobile controls */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            z-index: 90;
        }

        .hslot {
            width: 52px;
            height: 52px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 8px;
            cursor: pointer;
            border-radius: 2px;
            gap: 1px;
            transition: all 0.1s ease-out;
        }

        .hslot.active {
            border-color: #fff;
            border-width: 3px;
            transform: scale(1.1);
        }

        .hslot span {
            font-size: 22px; /* Emoji icons */
            line-height: 1;
        }

        /* Debug Info (FPS, XYZ, Biome) */
        #debug {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #fff;
            font-size: 11px;
            text-shadow: 1px 1px #000;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 8px;
            border-radius: 4px;
            z-index: 80;
        }

        /* Online Players Counter */
        #online {
            position: fixed;
            top: 8px;
            right: 8px;
            color: #fff;
            font-size: 11px;
            text-shadow: 1px 1px #000;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 8px;
            border-radius: 4px;
            z-index: 80;
        }

        /* Joystick Zone (Mobile Controls) */
        #jzone {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 130px;
            height: 130px;
            z-index: 95;
            touch-action: none; /* Prevent default touch behavior */
            -webkit-touch-callout: none;
        }

        #jbase {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            position: relative;
        }

        #jknob {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: none; /* No animation on knob movement */
        }

        /* Action Buttons (Mobile Controls) */
        #abtns {
            position: fixed;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            z-index: 95;
        }

        .abtn {
            width: 58px;
            height: 58px;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #888;
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.1s ease-out;
        }

        .abtn:active {
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* Healthbar */
        #healthbar {
            position: fixed;
            bottom: 200px; /* Adjust for mobile controls */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            z-index: 90;
        }

        .heart {
            font-size: 16px; /* Emoji heart */
            color: red; /* For actual health representation */
        }

        /* Message Box (e.g., "Player joined!") */
        #msgbox {
            position: fixed;
            bottom: 300px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 110;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            z-index: 2000; /* Highest z-index */
            text-align: center;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen p {
            font-size: 0.6em;
            margin-top: 15px;
            opacity: 0.8;
        }

        /* Fullscreen Button */
        #fullscreen-button {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9em;
            cursor: pointer;
            border-radius: 5px;
            z-index: 1001;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
            display: none; /* Show only if not already fullscreen */
        }

        #fullscreen-button:hover {
            background-color: #218838;
        }

        /* Custom Font (if needed, link from Google Fonts or self-host) */
        /* @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap'); */

        /* Hide mobile controls on desktop (optional, requires JS detection) */
        @media (min-width: 768px) {
            #jzone, #abtns {
                display: none;
            }
            #hotbar {
                bottom: 20px; /* Move hotbar down for desktop */
            }
            #healthbar {
                bottom: 80px; /* Move healthbar down for desktop */
            }
            #fullscreen-button {
                display: block; /* Always show on desktop for easy access */
            }
        }
    </style>
</head>

  <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>

</div>

<div id="loading-screen">
    <h1>Mycraft Web Edition</h1>
    <p>ကမ္ဘာကြီးကို တည်ဆောက်နေပါတယ်။ ခဏစောင့်ပေးပါ။</p>
</div>

<button id="fullscreen-button">မျက်နှာပြင်အပြည့်</button>

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Perlin Noise Library for World Generation -->
<script src="https://unpkg.com/perlin.js@1.0.0/perlin.js"></script>
<!-- Socket.io Client for Multiplayer -->
<script src="/socket.io/socket.io.js"></script>

<script>
// ═══════════════════════════════════════
// GLOBAL CONSTANTS & CORE SETUP
// ═══════════════════════════════════════
const CANVAS = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: CANVAS, antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // Optimize for device pixel ratio

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008); // Less dense fog for better view distance

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500); // Far clip increased for view distance
camera.position.set(0, 50, 0); // Start high up to avoid falling through

// Player properties
const PLAYER_HEIGHT = 1.8;
const PLAYER_EYE_HEIGHT = 1.6; // Where the camera is placed
const PLAYER_WIDTH = 0.6;
const GRAVITY = -0.018;
const JUMP_POWER = 0.22;
const WALK_SPEED = 0.09;
const RAYCAST_DISTANCE = 8; // How far player can interact with blocks

// Chunking Constants
const CHUNK_SIZE = 16; // 16x16x16 blocks per chunk
const RENDER_DISTANCE = 5; // Render 5 chunks around the player (5x5 = 25 chunks)
const MAX_BUILD_HEIGHT = 128; // Max Y-level for world generation

// ═══════════════════════════════════════
// TEXTURE & MATERIAL SYSTEM (Minecraft-like Textures)
// ═══════════════════════════════════════
const textureLoader = new THREE.TextureLoader();
const loadedTextures = {};
const blockMaterials = {}; // Store pre-made materials for performance

// Define texture paths for each block face
const texturePaths = {
    dirt: 'textures/dirt.png',
    grass_top: 'textures/grass_top.png',
    grass_side: 'textures/grass_side.png',
    stone: 'textures/stone.png',
    wood_side: 'textures/wood_side.png',
    wood_top: 'textures/wood_top.png',
    sand: 'textures/sand.png',
    brick: 'textures/brick.png',
    snow_top: 'textures/snow_top.png',
    snow_side: 'textures/snow_side.png',
    leaf: 'textures/leaf.png',
    water: 'textures/water.png',
    iron_ore: 'textures/iron_ore.png',
    coal_ore: 'textures/coal_ore.png',
    diamond_ore: 'textures/diamond_ore.png',
    bedrock: 'textures/bedrock.png',
};

// BLOCK_TYPES configuration with texture keys and properties
const BLOCK_TYPES = {
  air:   { transparent: true, collidable: false },
  dirt:  { top: 'dirt', side: 'dirt', bot: 'dirt', collidable: true },
  stone: { top: 'stone', side: 'stone', bot: 'stone', collidable: true },
  grass: { top: 'grass_top', side: 'grass_side', bot: 'dirt', collidable: true },
  wood:  { top: 'wood_top', side: 'wood_side', bot: 'wood_top', collidable: true },
  sand:  { top: 'sand', side: 'sand', bot: 'sand', collidable: true },
  brick: { top: 'brick', side: 'brick', bot: 'brick', collidable: true },
  snow:  { top: 'snow_top', side: 'snow_side', bot: 'dirt', collidable: true },
  leaf:  { top: 'leaf', side: 'leaf', bot: 'leaf', transparent: true, collidable: false }, // Leaves are not fully solid
  water: { top: 'water', side: 'water', bot: 'water', transparent: true, collidable: false, isFluid: true },
  iron_ore: { top: 'iron_ore', side: 'iron_ore', bot: 'iron_ore', collidable: true },
  coal_ore: { top: 'coal_ore', side: 'coal_ore', bot: 'coal_ore', collidable: true },
  diamond_ore: { top: 'diamond_ore', side: 'diamond_ore', bot: 'diamond_ore', collidable: true },
  bedrock: { top: 'bedrock', side: 'bedrock', bot: 'bedrock', collidable: true },
};
// Hotbar block types (must match keys in BLOCK_TYPES)
const hotbarBlockTypes = ['dirt', 'stone', 'grass', 'wood', 'sand', 'brick', 'snow', 'leaf'];
let selectedBlockType = hotbarBlockTypes[0]; // Currently selected block type

// Preload all textures
function preloadTextures() {
    let loadedCount = 0;
    const totalTextures = Object.keys(texturePaths).length;
    const loadingScreen = document.getElementById('loading-screen');
    const loadingText = loadingScreen.querySelector('p');

    for (const key in texturePaths) {
        const path = texturePaths[key];
        textureLoader.load(path,
            (texture) => {
                texture.magFilter = THREE.NearestFilter; // Pixelated effect
                texture.minFilter = THREE.NearestFilter; // Pixelated effect
                loadedTextures[key] = texture;
                loadedCount++;
                loadingText.textContent = `Loading textures: ${Math.floor((loadedCount / totalTextures) * 100)}%`;
                if (loadedCount === totalTextures) {
                    console.log('All textures loaded!');
                    createBlockMaterials(); // Create materials once textures are loaded
                    initGame(); // Initialize game components after loading
                }
            },
            undefined, // onProgress callback - handled by loadingText update
            (err) => {
                console.error(`Error loading texture ${path}:`, err);
                loadedCount++;
                if (loadedCount === totalTextures) {
                    console.log('All textures loaded (with errors)!');
                    createBlockMaterials();
                    initGame();
                }
            }
        );
    }
}

// Create materials for each block type once textures are loaded
function createBlockMaterials() {
    for (const typeKey in BLOCK_TYPES) {
        const blockDef = BLOCK_TYPES[typeKey];
        if (blockDef.transparent) {
            // For transparent blocks like water/leaves
            const texture = loadedTextures[blockDef.top || blockDef.side];
            blockMaterials[typeKey] = new THREE.MeshLambertMaterial({
                map: texture,
                transparent: true,
                opacity: blockDef.isFluid ? 0.7 : 0.9, // Water is more transparent
                alphaTest: blockDef.isFluid ? 0.0 : 0.5, // For leaves transparency
                side: THREE.DoubleSide // Render both sides for transparent blocks
            });
        } else if (blockDef.top) {
            // For solid blocks with different top/side/bottom textures
            blockMaterials[typeKey] = [
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.side], vertexColors: true }), // Right
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.side], vertexColors: true }), // Left
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.top], vertexColors: true }),  // Top
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.bot], vertexColors: true }),  // Bottom
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.side], vertexColors: true }), // Front
                new THREE.MeshLambertMaterial({ map: loadedTextures[blockDef.side], vertexColors: true }), // Back
            ];
        } else {
            // Fallback for types without specific textures (e.g., air)
            blockMaterials[typeKey] = new THREE.MeshLambertMaterial({ color: 0x000000, transparent: true, opacity: 0 });
        }
    }
}

// ═══════════════════════════════════════
// LIGHTING + SKY (Enhanced Day/Night Cycle)
// ═══════════════════════════════════════
const skyColors = { day: 0x87CEEB, sunset: 0xFF7043, night: 0x0a0a2e };
const ambientDayColor = new THREE.Color(0xffffff);
const ambientNightColor = new THREE.Color(0x222244);
const fogDayColor = new THREE.Color(0x87CEEB);
const fogNightColor = new THREE.Color(0x0a0a2e);

let timeOfDay = 0.25; // 0-1, 0.25 is morning, 0.5 is noon, 0.75 is evening, 0 is midnight
const DAY_CYCLE_SPEED = 0.00005; // Adjust for faster/slower day cycle

const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
sun.position.set(50, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; // Increased shadow quality
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 200;
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x4a7c2f, 0.4);
scene.add(hemi);

// Stars (more realistic distribution)
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 5000; i++) { // More stars
  starVerts.push((Math.random() - 0.5) * 600, (Math.random() * 200 + 150), (Math.random() - 0.5) * 600);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })); // Slightly larger stars
scene.add(stars);

// ═══════════════════════════════════════
// CHUNKING SYSTEM (Core for Performance)
// ═══════════════════════════════════════
const chunks = {}; // Stores Chunk objects by key "x,z"
const blockData = {}; // Stores individual block types by key "x,y,z"
let currentChunkX = 0;
let currentChunkZ = 0;

class Chunk {
    constructor(x, z) {
        this.x = x;
        this.z = z;
        this.key = `${x},${z}`;
        this.mesh = null; // Will hold the Three.js mesh for the chunk
        this.blocks = {}; // Local block data for this chunk
        this.isGenerated = false;
        this.isDirty = false; // True if blocks inside changed and mesh needs rebuild
    }

    // Generates the initial terrain for this chunk
    generate() {
        if (this.isGenerated) return;

        const startX = this.x * CHUNK_SIZE;
        const startZ = this.z * CHUNK_SIZE;

        for (let x = 0; x < CHUNK_SIZE; x++) {
            for (let z = 0; z < CHUNK_SIZE; z++) {
                const worldX = startX + x;
                const worldZ = startZ + z;

                // Perlin Noise for heightmap
                const height = Math.floor(
                    perlin.get(worldX * 0.015, worldZ * 0.015) * 15 + // Large scale terrain
                    perlin.get(worldX * 0.05, worldZ * 0.05) * 5 +    // Medium scale details
                    perlin.get(worldX * 0.1, worldZ * 0.1) * 2       // Small scale details
                ) + 30; // Base height

                // Determine biome based on noise or position
                const biomeVal = perlin.get(worldX * 0.001, worldZ * 0.001); // Slower changing noise for biomes
                let topBlockType = 'grass';
                let subBlockType = 'dirt';

                if (biomeVal > 0.4) { // Desert
                    topBlockType = 'sand';
                    subBlockType = 'sand';
                } else if (biomeVal < -0.3) { // Snowy mountains
                    if (height > 45) { // Higher altitudes get snow
                        topBlockType = 'snow';
                        subBlockType = 'snow';
                    } else { // Lower altitudes in cold biome
                        topBlockType = 'grass';
                        subBlockType = 'dirt';
                    }
                }
                // Add water for low areas
                if (height < 32 && topBlockType !== 'sand') {
                    // Water level
                    for (let y = height + 1; y <= 32; y++) {
                        this.setBlock(worldX, y, worldZ, 'water');
                    }
                    topBlockType = 'sand'; // Shoreline
                    subBlockType = 'sand';
                }


                // Bedrock layer
                this.setBlock(worldX, 0, worldZ, 'bedrock');

                // Generate layers from bottom up
                for (let y = 1; y < height - 3; y++) { // Stone base
                    this.setBlock(worldX, y, worldZ, 'stone');
                }
                for (let y = height - 3; y < height; y++) { // Dirt/Sand layers
                    this.setBlock(worldX, y, worldZ, subBlockType);
                }
                this.setBlock(worldX, height, worldZ, topBlockType); // Top layer

                // Tree generation (simple version)
                if (Math.random() < 0.005 && topBlockType === 'grass' && height > 35) {
                    const treeHeight = Math.floor(Math.random() * 3) + 4; // 4-6 blocks tall
                    for (let y = 1; y <= treeHeight; y++) {
                        this.setBlock(worldX, height + y, worldZ, 'wood');
                    }
                    // Simple leaf sphere
                    for (let lx = -2; lx <= 2; lx++) {
                        for (let lz = -2; lz <= 2; lz++) {
                            for (let ly = 0; ly <= 1; ly++) {
                                if (Math.abs(lx) + Math.abs(lz) <= 2 && !(lx === 0 && lz === 0 && ly === 0)) { // Don't replace log center
                                    this.setBlock(worldX + lx, height + treeHeight + ly, worldZ + lz, 'leaf');
                                }
                            }
                        }
                    }
                }

                // Ore generation (simple, within stone layer)
                if (Math.random() < 0.002 && height > 1 && height < 40) { // Ores below surface
                    const oreY = Math.floor(Math.random() * (height - 2)) + 1; // Between bedrock and top layers
                    let oreType = 'coal_ore';
                    if (Math.random() < 0.3) oreType = 'iron_ore';
                    if (Math.random() < 0.05) oreType = 'diamond_ore'; // Rare
                    if (this.getBlock(worldX, oreY, worldZ) === 'stone') { // Only replace stone
                        this.setBlock(worldX, oreY, worldZ, oreType);
                    }
                }
            }
        }
        this.isGenerated = true;
        this.isDirty = true; // Mark for mesh rebuild
    }

    // Gets a block type from this chunk's local data
    getBlock(x, y, z) {
        const key = `${x},${y},${z}`;
        return this.blocks[key] || 'air';
    }

    // Sets a block type in this chunk's local data and global data
    setBlock(x, y, z, type) {
        const key = `${x},${y},${z}`;
        this.blocks[key] = type;
        blockData[key] = type; // Also update global block data for collision checks
        this.isDirty = true; // Mark for mesh rebuild
    }

    // Builds a single optimized mesh for the entire chunk
